# CI for patent-checker.
#
# "check" runs lint, format check and the unit tests on Linux, "check-macos"
# and "check-windows" run the unit tests on the other two desktop platforms,
# and "container" builds the Docker image and drives it through
# tools/container_smoke.sh (docker compose up, /health, bearer token,
# operator-notice gate). Unit tests never touch the network; the container
# smoke test starts the server in degraded mode (no EPO OPS credentials)
# with a throw-away bearer token that is never printed.
name: CI

on:
  push:
    branches:
      - main
      - "v*"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint, format check and unit tests
        run: tools/check.sh

  check-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Unit tests
        run: uv run pytest -q

  check-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Unit tests
        run: uv run pytest -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: patent-checker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image with docker compose
        env:
          PATENT_CHECKER_IMAGE: patent-checker:ci
        run: tools/container_smoke.sh
