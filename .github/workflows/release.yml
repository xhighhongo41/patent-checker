# Release workflow for patent-checker.
#
# Runs when a version tag (v*) is pushed: verifies that the tag matches the
# version declared in pyproject.toml, builds the multi-architecture image and
# pushes it to GHCR (always) and to Docker Hub (only when the Docker Hub
# variables and token are configured), then builds the wheel and sdist and
# publishes them to PyPI through trusted publishing (OIDC), so no API token
# is stored in the repository.
#
# Every push to a version branch (v*) runs the same workflow as a dry run:
# the image is built for both architectures but not pushed, and the
# distributions are built but not uploaded. Once the workflow exists on the
# default branch it can also be started by hand (workflow_dispatch), with
# `publish` deciding between a dry run and a real publication.
name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image and publish to PyPI (otherwise a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      images: ${{ steps.decide.outputs.images }}
      dockerhub: ${{ steps.decide.outputs.dockerhub }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify the tag matches the declared version
        if: github.ref_type == 'tag'
        run: |
          declared="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tag" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match declared version ${declared}" >&2
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} matches declared version ${declared}"

      - name: Decide what to publish and where
        id: decide
        env:
          REF_TYPE: ${{ github.ref_type }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$REF_TYPE" = "tag" ] || [ "$PUBLISH_INPUT" = "true" ]; then
            publish=true
          else
            publish=false
          fi
          images="ghcr.io/${GITHUB_REPOSITORY}"
          dockerhub=false
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_NAMESPACE" ] && [ "$DOCKERHUB_TOKEN_SET" = "true" ]; then
            dockerhub=true
            images="$(printf '%s\n%s' "$images" "docker.io/${DOCKERHUB_NAMESPACE}/patent-checker")"
          else
            echo "Docker Hub is not configured (DOCKERHUB_USERNAME / DOCKERHUB_NAMESPACE / DOCKERHUB_TOKEN); pushing to GHCR only"
          fi
          {
            echo "publish=${publish}"
            echo "dockerhub=${dockerhub}"
            echo "images<<EOF"
            echo "${images}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "publish=${publish} dockerhub=${dockerhub}"

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: needs.verify.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.verify.outputs.publish == 'true' && needs.verify.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.verify.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=dry-run,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=patent-checker
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build (and push) the multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.verify.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pypi:
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        if: needs.verify.outputs.publish == 'true'
        run: uv publish --trusted-publishing always
