# Release workflow for patent-checker.
#
# Runs when a version tag (v*) is pushed: verifies that the tag matches the
# version declared in pyproject.toml and server.json, builds the
# multi-architecture image and pushes it to GHCR (always) and to Docker Hub
# (only when the Docker Hub variables and token are configured), builds the
# wheel and sdist and publishes them to PyPI through trusted publishing
# (OIDC), refreshes the Docker Hub overview from the README, and finally
# publishes server.json to the official MCP Registry (GitHub OIDC again). No
# API token is stored in the repository.
#
# Every push to a version branch (v*) runs the same workflow as a dry run:
# the image is built for both architectures but not pushed, the
# distributions are built but not uploaded, and the two metadata jobs are
# skipped. Publication happens only from a tag: a manual run
# (workflow_dispatch) can rebuild as a dry run, but asking it to publish from
# anything other than a tag fails on purpose, so the tag/version check can
# never be bypassed.
#
# Every third-party action is pinned to a commit SHA (the tag it corresponds
# to is in the trailing comment); Dependabot keeps the pins current.
name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image and publish (only allowed when run from a tag)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      images: ${{ steps.decide.outputs.images }}
      dockerhub: ${{ steps.decide.outputs.dockerhub }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the tag matches the declared versions
        if: github.ref_type == 'tag'
        run: |
          declared="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          registry="$(python3 -c "import json; print(json.load(open('server.json'))['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tag" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match declared version ${declared}" >&2
            exit 1
          fi
          if [ "$registry" != "$tag" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match server.json version ${registry}" >&2
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} matches pyproject.toml and server.json (${declared})"

      - name: Validate server.json
        run: python3 -m json.tool server.json > /dev/null && echo "server.json is well-formed"

      - name: Decide what to publish and where
        id: decide
        env:
          REF_TYPE: ${{ github.ref_type }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$PUBLISH_INPUT" = "true" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "publishing is only allowed from a version tag (this run is on a $REF_TYPE)" >&2
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            publish=true
          else
            publish=false
          fi
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          images="ghcr.io/${GITHUB_REPOSITORY}"
          dockerhub=false
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_NAMESPACE" ] && [ "$DOCKERHUB_TOKEN_SET" = "true" ]; then
            dockerhub=true
            images="$(printf '%s\n%s' "$images" "docker.io/${DOCKERHUB_NAMESPACE}/patent-checker")"
          else
            echo "Docker Hub is not configured (DOCKERHUB_USERNAME / DOCKERHUB_NAMESPACE / DOCKERHUB_TOKEN); pushing to GHCR only"
          fi
          {
            echo "publish=${publish}"
            echo "dockerhub=${dockerhub}"
            echo "version=${version}"
            echo "images<<EOF"
            echo "${images}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "publish=${publish} dockerhub=${dockerhub} version=${version}"

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: needs.verify.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.verify.outputs.publish == 'true' && needs.verify.outputs.dockerhub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.verify.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=dry-run,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=patent-checker
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build (and push) the multi-architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.verify.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pypi:
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        if: needs.verify.outputs.publish == 'true'
        run: uv publish --trusted-publishing always

  dockerhub-description:
    # Refreshes the Docker Hub repository overview from the README so the
    # Hub page is not blank. Needs a Docker Hub token with read/write scope;
    # if the configured token cannot write the description this job fails
    # on its own without affecting the published artifacts.
    needs: [verify, image]
    if: needs.verify.outputs.publish == 'true' && needs.verify.outputs.dockerhub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the Docker Hub overview from README.md
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE }}/patent-checker
          short-description: "Prior-art exploration MCP server; finds related patents, never judges infringement"
          readme-filepath: ./README.md
          enable-url-completion: true

  registry:
    # Publishes server.json to the official MCP Registry. Authentication is
    # GitHub OIDC (no secret to store); ownership of the PyPI package and the
    # GHCR image is verified by the registry through the README marker and
    # the image label, so this job runs after both are public. The registry
    # is in preview; a failure here does not undo anything published above.
    needs: [verify, image, pypi]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help > /dev/null

      - name: Log in to the MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
