[project]
name = "patent-checker"
version = "0.5.0"
description = "Prior-art exploration for software projects: an MCP server and Agent Skill that find related patents and report observations, never an infringement verdict"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "xhighhongo41"}]
keywords = [
    "patent",
    "prior-art",
    "mcp",
    "agent-skill",
    "epo-ops",
    "google-patents",
    "mcp-server",
    "model-context-protocol",
    "prior-art-search",
    "patent-search",
    "agent-skills",
    "fastmcp",
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "httpx",
    "beautifulsoup4",
    "lxml",
    "python-dotenv",
    "fastmcp>=4.0.1,<5",
]

[project.urls]
Homepage = "https://github.com/xhighhongo41/patent-checker"
Repository = "https://github.com/xhighhongo41/patent-checker"
Issues = "https://github.com/xhighhongo41/patent-checker/issues"
Changelog = "https://github.com/xhighhongo41/patent-checker/blob/main/README.md#changelog"
Documentation = "https://github.com/xhighhongo41/patent-checker#readme"
Security = "https://github.com/xhighhongo41/patent-checker/blob/main/SECURITY.md"

[project.scripts]
patent-checker = "patent_checker.cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patent_checker"]

[tool.hatch.build.targets.wheel.force-include]
"skills/patent-checker" = "patent_checker/_skill/patent-checker"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
