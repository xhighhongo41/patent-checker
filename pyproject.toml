[project]
name = "patent-checker-poc"
version = "0.1.0"
description = "Proof-of-concept scripts for Patent Checker v0.1 (external API observation)"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "lxml",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# Scripts only for v0.1; nothing to build or install as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["poc/tests"]
pythonpath = ["poc"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
