[project]
name = "patent-checker"
version = "0.4.0"
description = "Patent prior-art exploration toolkit: core library and CLI"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "lxml",
    "python-dotenv",
    "fastmcp>=4.0.1,<5",
]

[project.scripts]
patent-checker = "patent_checker.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patent_checker"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
