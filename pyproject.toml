[project]
name = "patent-checker"
version = "0.4.0"
description = "Patent prior-art exploration toolkit: core library and CLI; it does not judge infringement"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "xhighhongo41"}]
keywords = ["patent", "prior-art", "mcp", "agent-skill", "epo-ops", "google-patents"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx",
    "beautifulsoup4",
    "lxml",
    "python-dotenv",
    "fastmcp>=4.0.1,<5",
]

[project.urls]
Homepage = "https://github.com/xhighhongo41/patent-checker"
Repository = "https://github.com/xhighhongo41/patent-checker"
Issues = "https://github.com/xhighhongo41/patent-checker/issues"
Changelog = "https://github.com/xhighhongo41/patent-checker/blob/main/README.md#changelog"

[project.scripts]
patent-checker = "patent_checker.cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patent_checker"]

[tool.hatch.build.targets.wheel.force-include]
"skills/patent-checker" = "patent_checker/_skill/patent-checker"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
